services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pacewise
      POSTGRES_USER: pacewise
      POSTGRES_PASSWORD: ${PACEWISE_DB_PASSWORD:-pacewise-local-only}
    ports:
      - "5433:5432"
    volumes:
      - pacewise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacewise -d pacewise"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://pacewise:${PACEWISE_DB_PASSWORD:-pacewise-local-only}@postgres:5432/pacewise
      LMS_BASE_URL: http://host.docker.internal:8010
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pacewise_postgres_data:
