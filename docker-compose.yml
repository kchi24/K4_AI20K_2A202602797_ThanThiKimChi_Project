name: pacewise

services:
  pacewise-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pacewise
      POSTGRES_USER: pacewise
      POSTGRES_PASSWORD: ${PACEWISE_DB_PASSWORD:-pacewise-local-only}
    ports:
      - "5433:5432"
    volumes:
      - pacewise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacewise -d pacewise"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  lms-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: canvas_development
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: ${LMS_DB_PASSWORD:-canvas-local-only}
    ports:
      - "5434:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas_development"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  lms-simulator:
    build:
      context: ./lms-simulator
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      DATABASE_URL: postgresql+psycopg://canvas:${LMS_DB_PASSWORD:-canvas-local-only}@lms-postgres:5432/canvas_development
      PACEWISE_API_KEY: ${PACEWISE_API_KEY:-development-only-service-key-change-me}
      PACEWISE_LAUNCH_SECRET: ${PACEWISE_LAUNCH_SECRET:-development-only-launch-secret-change-me}
      PACEWISE_URL: ${PACEWISE_URL:-http://localhost:5173}
      SESSION_LIFETIME_HOURS: ${SESSION_LIFETIME_HOURS:-12}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - lms_uploads:/app/uploads
    depends_on:
      lms-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://pacewise:${PACEWISE_DB_PASSWORD:-pacewise-local-only}@pacewise-postgres:5432/pacewise
      LMS_BASE_URL: http://lms-simulator:8010
      PACEWISE_API_KEY: ${PACEWISE_API_KEY:-development-only-service-key-change-me}
      PACEWISE_SESSION_SECRET: ${PACEWISE_SESSION_SECRET:-development-only-session-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      VECTOR_STORE_TYPE: qdrant
      QDRANT_PATH: /app/data/qdrant
      EMBEDDING_CACHE_DIR: /app/data/models/fastembed
      RERANKER_CACHE_DIR: /app/data/models/flashrank
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      LANGGRAPH_STRICT_MSGPACK: "true"
    volumes:
      - ./data:/app/data
    depends_on:
      pacewise-postgres:
        condition: service_healthy
      lms-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/pacewise
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-pacewise-local-only}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pacewise_postgres_data:
  lms_postgres_data:
  lms_uploads:
  prometheus_data:
  grafana_data:
