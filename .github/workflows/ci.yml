name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: [self-hosted, Windows, X64, team-8]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: python -m ruff check src/ evals/ tests/

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --cov=src.agents --cov-report=term-missing --cov-fail-under=80
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          PYTHONUTF8: "1"

      - name: Run deterministic AI evaluation (3 x 120 samples)
        run: python -m evals.run_agent_eval
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          PYTHONUTF8: "1"
