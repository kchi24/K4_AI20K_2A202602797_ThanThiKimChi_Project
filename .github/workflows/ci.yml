name: CI

on:
  push:
    branches: [main, develop, Develop, phamkhactu]
  pull_request:
    branches: [main, develop, Develop, phamkhactu]

jobs:
  lint-and-test:
    runs-on: [self-hosted, Windows, X64, team-8]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint with ruff
        run: python -m ruff check src/ evals/ tests/ lms-simulator/app/ lms-simulator/tests/

      - name: Run backend tests
        run: python -m pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --cov-fail-under=90
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          PYTHONUTF8: "1"

      - name: Run deterministic AI evaluation (4 x 120 + 100 adversarial samples)
        run: python -m evals.run_agent_eval
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          PYTHONUTF8: "1"

      - name: Run reproducible manual acceptance evidence
        run: python -m evals.run_manual_evidence
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          PYTHONUTF8: "1"

      - name: Run LMS simulator tests
        run: python -m pytest tests/ -q
        working-directory: lms-simulator

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm.cmd ci --no-audit --no-fund
        working-directory: frontend/pacewise

      - name: Run frontend unit and accessibility tests
        run: npm.cmd test
        working-directory: frontend/pacewise
        env:
          # Keep Node predictable on the shared Windows runner where Docker/WSL
          # may already consume most of the available commit memory.
          NODE_OPTIONS: --max-old-space-size=1024

      - name: Typecheck and build frontend
        run: npm.cmd run build
        working-directory: frontend/pacewise
        env:
          NODE_OPTIONS: --max-old-space-size=1024
